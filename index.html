<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Go! — XO Labs</title>
<meta name="description" content="Cat Go! — a mobile maze game by XO Labs. Legal and privacy information.">
<link rel="icon" href="icon.png">
<style>
  :root{
    --ink:#2a2118; --muted:#6b5c4a; --rule:#e6dccb;
    --paper:#fffdf7; --accent:#8B6239; --grass:#20C028;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:40px 20px; background:var(--paper); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card{max-width:520px;width:100%;text-align:center}
  img.icon{width:112px;height:112px;border-radius:24px;display:block;margin:0 auto 22px}
  h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
  .tag{color:var(--muted);margin:0 0 32px}
  a.btn{
    display:inline-block;padding:13px 22px;border-radius:12px;
    background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
  }
  a.btn:hover{filter:brightness(1.08)}
  footer{margin-top:36px;color:var(--muted);font-size:14px}
  footer a{color:var(--accent)}
  @media (prefers-color-scheme: dark){
    :root{--ink:#ece4d8;--muted:#a3927c;--rule:#3a3229;--paper:#17130f;--accent:#d8a86a}
    a.btn{color:#17130f}
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="Cat Go! icon">
    <h1>Cat Go!</h1>
    <p class="tag">Pick a wall. Pay the price.<br>A mobile maze game by XO Labs.</p>
    <a class="btn" href="/privacy-policy">Privacy Policy</a>
    <footer>
      <a href="mailto:xo.labs.production@gmail.com">xo.labs.production@gmail.com</a>
    </footer>
  </div>
</body>
</html>
